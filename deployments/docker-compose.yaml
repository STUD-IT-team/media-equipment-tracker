services:
  db-media-equipment-tracker:
    image: postgres:17.4-alpine3.20
    container_name: db-media-equipment-tracker
    hostname: db
    restart: unless-stopped
    command: postgres
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 4G
    env_file:
      - postgres.env
    volumes:
      - vol-media-equipment-tracker:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vol-media-equipment-tracker:
    driver: local