services:
  db-media-equipment-tracker:
    image: postgres:17.4-alpine3.20
    container_name: db-media-equipment-tracker
    hostname: db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 4G
    env_file:
      - postgres.env
    volumes:
      - pg-vol-media-equipment-tracker:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - postgres-media-equipment-tracker

  migrator-media-equipment-tracker:
    container_name: migrator-media-equipment-tracker
    depends_on:
      db-media-equipment-tracker:
        condition: service_healthy
    env_file:
      - migrator.env
    build:
      context: ./migrations
      dockerfile: Dockerfile
    networks:
      - postgres-media-equipment-tracker

networks:
  postgres-media-equipment-tracker:
    name: postgres-media-equipment-tracker

volumes:
  pg-vol-media-equipment-tracker: