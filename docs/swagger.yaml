    CreateUserDto:
      type: object
      required: [invite_token, full_name, email, hash_password]
      properties:
        invite_token:
          type: string
          description: Уникальный токен приглашения
        full_name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        hash_password:
          type: string
          minLength: 8
          description: Пароль (будет захеширован bcrypt)

    LoginDto:
      type: object
      required: [email, hash_password]
      properties:
        email:
          type: string
          format: email
        hash_password:
          type: string
          format: password

    CreateEquipmentDto:
      type: object
      required: [inventory_number, name, category]
