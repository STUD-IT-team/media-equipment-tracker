                      type: number
                    total_penalty_nice:
                      type: integer

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ==================== ENUMS ====================
    
    RoleInDepartment:
      type: string
      enum: [trainee, activist]
      description: Роль пользователя в отделе
    
    EquipmentStatus:
      type: string
      enum: [available, issued, under_maintenance, unavailable]
      description: Статус оборудования
    
    EquipmentInvocationStatus:
      type: string
      enum: [created, under_review, changes_required, approved, equipment_issued, equipment_returned, completed, cancelled]
      description: |
        Статусы заявки на оборудование:
        - created — Создана
        - under_review — На рассмотрении
        - changes_required — Требуются изменения
        - approved — Одобрена
        - equipment_issued — Выдано оборудование
        - equipment_returned — Сдано оборудование
        - completed — Завершена
        - cancelled — Отменена
    
    StudioInvocationStatus:
      type: string
      enum: [created, under_review, changes_required, approved, completed, cancelled]
      description: |
        Статусы заявки на студию:
        - created — Создана
        - under_review — На рассмотрении
        - changes_required — Требуются изменения
        - approved — Одобрена
        - completed — Завершена
        - cancelled — Отменена

    # ==================== DTOs ====================
    
    CreateUserDto:
      type: object
      required: [invite_token, full_name, email, password]
      properties:
        invite_token:
          type: string
        full_name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginDto:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    UpdateUserDto:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email

    UpdateUserAdminDto:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 255
          description: Новое ФИО пользователя
        email:
          type: string
          format: email
          description: Новый email (должен быть уникальным)
        password:
          type: string
          minLength: 8
          description: Новый пароль
        nice:
          type: integer
          minimum: 1
          description: Баллы порядочности (CHECK nice > 0)
        is_admin:
          type: boolean
          description: Назначить/снять права администратора
        organizations:
          type: array
          description: Полный список организаций пользователя (заменяет существующие)
          items:
            type: object
            required: [organization_id, action]
            properties:
              organization_id:
                type: string
                format: uuid
              action:
                type: string
                enum: [add, remove]
                description: add - добавить, remove - удалить
        departments:
          type: array
          description: Полный список отделов и ролей пользователя (заменяет существующие)
          items:
            type: object
            required: [department_id, role, action]
            properties:
              department_id:
                type: string
                format: uuid
              role:
                $ref: '#/components/schemas/RoleInDepartment'
              action:
                type: string
                enum: [add, update, remove]
                description: add - добавить, update - изменить роль, remove - удалить

    CreateOrganizationDto:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255

    UpdateOrganizationDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255

    CreateDepartmentDto:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255

    UpdateDepartmentDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255

    CreateEquipmentDto:
      type: object
      required: [inventory_number, name, category]
      properties:
        inventory_number:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 255
        short_name:
          type: string
          maxLength: 100
        category:
          type: string
          maxLength: 100
        available_to_trainee:
          type: boolean
          default: false
        status:
          $ref: '#/components/schemas/EquipmentStatus'
        department_ids:
          type: array
          items:
            type: string
            format: uuid

    UpdateEquipmentDto:
      type: object
      properties:
        inventory_number:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 255
        short_name:
          type: string
          maxLength: 100
        category:
          type: string
          maxLength: 100
        available_to_trainee:
          type: boolean
        status:
          $ref: '#/components/schemas/EquipmentStatus'

    CreateEquipmentInvocationDto:
      type: object
      required: [event_name, start_time, end_time, equipment_return_time, sd_card_return_time, equipment_ids]
      properties:
        event_name:
          type: string
          maxLength: 255
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        equipment_return_time:
          type: string
          format: date-time
        sd_card_return_time:
          type: string
          format: date-time
        organization_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        equipment_ids:
          type: array
          items:
            type: string
            format: uuid

    UpdateEquipmentInvocationDto:
      type: object
      properties:
        event_name:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        equipment_return_time:
          type: string
          format: date-time
        sd_card_return_time:
          type: string
          format: date-time
        equipment_ids:
          type: array
          items:
            type: string
            format: uuid

    CreateStudioInvocationDto:
      type: object
      required: [event_name, shooting_description, start_time, end_time, organization_id, department_id]
      properties:
        event_name:
          type: string
          maxLength: 255
        shooting_description:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        needs_chromakey:
          type: boolean
          default: false
        needs_cyclorama:
          type: boolean
          default: false
        needs_black_fabric:
          type: boolean
          default: false
        organization_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        equipment_ids:
          type: array
          items:
            type: string
            format: uuid

    UpdateStudioInvocationDto:
      type: object
      properties:
        event_name:
          type: string
        shooting_description:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        needs_chromakey:
          type: boolean
        needs_cyclorama:
