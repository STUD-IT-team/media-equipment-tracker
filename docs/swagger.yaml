          type: string
          maxLength: 255
        start_time:
          type: string
          format: date-time
          description: Начало мероприятия
        end_time:
          type: string
          format: date-time
          description: Окончание мероприятия
        equipment_return_time:
          type: string
          format: date-time
          description: Время возврата оборудования
        sd_card_return_time:
          type: string
          format: date-time
          description: Время возврата SD-карт
        organization_id:
          type: string
          format: uuid
          description: ID организации (взаимоисключающий с department_id, exactly_one_not_null)
        department_id:
          type: string
          format: uuid
          description: ID отдела (взаимоисключающий с organization_id, exactly_one_not_null)
        equipment_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Список ID оборудования для таблицы equipment_in_invocation (корзина - SHOULD)

